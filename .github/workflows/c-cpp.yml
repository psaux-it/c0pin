name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Install
        run: sudo make install

      - name: Verify systemd units
        run: |
          systemd-analyze verify \
            /etc/systemd/system/c0pin-performance.service \
            /etc/systemd/system/c0pin-aggressive.service

      - name: Clean build
        run: make clean

      - name: Rebuild
        run: make
