name: c0pin CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Install
        run: sudo make install

      - name: Verify systemd units
        run: |
          systemd-analyze verify \
            /etc/systemd/system/c0pin-performance.service \
            /etc/systemd/system/c0pin-aggressive.service

      - name: Smoke test binary
        run: |
          test -x /usr/local/sbin/c0pin

      - name: Smoke test performance policy
        run: |
          if compgen -G "/sys/devices/system/cpu/cpufreq/policy*" > /dev/null; then
            sudo /usr/local/sbin/c0pin --performance-policy
          else
            echo "No CPUFreq policies available, skipping performance smoke test"
          fi

      - name: Smoke test aggressive mode
        run: |
          if [ -e /dev/cpu_dma_latency ] && \
             compgen -G "/sys/devices/system/cpu/cpufreq/policy*" > /dev/null; then

            set +e

            sudo timeout \
              --signal=TERM \
              --kill-after=5s \
              10 \
              /usr/local/sbin/c0pin --aggressive 0

            rc=$?

            set -e

            case "$rc" in
              124|143)
                echo "Aggressive mode terminated by timeout as expected"
                ;;
              0)
                echo "Aggressive mode exited normally"
                ;;
              *)
                echo "Aggressive mode failed with exit code: $rc"
                exit "$rc"
                ;;
            esac

          else
            echo "Required CPUFreq policies or CPU DMA latency interface unavailable, skipping aggressive smoke test"
          fi

      - name: Clean build
        run: make clean

      - name: Rebuild
        run: make
